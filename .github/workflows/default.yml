name: Pipeline

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Install junitreport
        run: |
          dart pub global activate junitreport
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Run Tests
        run: set -o pipefail; dart test --reporter json --coverage=coverage | tojunit -o report.xml
      - name: Format coverage
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore
      - name: Coverage summary
        run: lcov --summary coverage/lcov.info
      - name: Enforce coverage threshold
        run: lcov --summary coverage/lcov.info --fail-under-lines 75
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: report.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  dry_run_publish:
    name: Dry-run publish check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run

  format:
    name: Format idempotency gate
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --set-exit-if-changed .

  build:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: mkdir -p build && dart compile exe bin/dart_xcodeproj.dart -o build/dart_xcodeproj

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [analyze, test, dry_run_publish, format, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

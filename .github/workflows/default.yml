name: Pipeline

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Install junitreport
        run: |
          dart pub global activate junitreport
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Run Tests
        run: set -o pipefail; dart test --reporter json --coverage=coverage | tojunit -o report.xml
      - name: Format coverage
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore
      - name: Coverage summary
        run: lcov --summary coverage/lcov.info
      - name: Enforce coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 75
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: report.xml, coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  dry_run_publish:
    name: Dry-run publish check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run

  format:
    name: Format idempotency gate
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
